# ── SkillForge Spring Boot API ──────────────────────────────────
#
# Port 8080 — does not clash with Node.js on 3000.
# Frontend course fetch calls will target http://localhost:8080/api
#
server.port=8080
spring.application.name=skillforge-spring-api

# ── Logging ────────────────────────────────────────────────────
# Show request mapping summary on startup
logging.level.org.springframework.web=INFO

# ── JSON ────────────────────────────────────────────────────────
# Don't include properties with null values in JSON responses
spring.jackson.default-property-inclusion=non_null
