# ── SkillForge Spring Boot API ──────────────────────────────────
#
# Port 8080 — does not clash with Node.js on 3000.
#
server.port=8080
spring.application.name=skillforge-spring-api

# ── MongoDB Atlas ───────────────────────────────────────────────
# Reads from MONGODB_URI environment variable.
# Set this in your shell before running, OR add it to start.bat.
# NEVER hardcode the connection string here — it contains your password.
#
# Same Atlas cluster as the Node.js server — shared database.
# Course data lives in the 'courses' collection.
#
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=skillforge

# ── Logging ────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO

# ── JSON ────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
